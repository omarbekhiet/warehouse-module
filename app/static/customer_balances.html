<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>أرصدة العملاء</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Cairo', sans-serif; background: #f5f6fa; padding: 20px; }
.container-box { max-width: 1500px; margin: 0 auto; }
h2 { color: #1e3c72; font-weight: 700; }
.card-box { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
table { font-size: 0.85rem; }
.total-row { background: #e3f2fd; font-weight: 700; }
.balance-positive { color: #c62828; font-weight: 700; }
.balance-zero { color: #2e7d32; font-weight: 700; }
.stat-card { border-radius: 10px; padding: 15px; color: white; margin-bottom: 15px; }
.stat-card .label { font-size: 0.8rem; opacity: 0.9; }
.stat-card .value { font-size: 1.5rem; font-weight: 700; }

/* ============================================
   إلغاء أسهم input[type=number]
   ============================================ */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button {
    -webkit-appearance: none !important;
    margin: 0 !important;
}
input[type=number] {
    -moz-appearance: textfield !important;
    appearance: textfield !important;
}
input[type="number"] {
    -moz-appearance: textfield !important;
}

</style>
<script src="permissions.js"></script>



<style id="compact-spacing-global">
/* ============================================
   توحيد المسافات المضغوطة
   ============================================ */

.table td, .table th {
    padding: 3px 6px !important;
    font-size: 0.75rem !important;
    vertical-align: middle !important;
    line-height: 1.2 !important;
}

.table tbody tr {
    height: auto !important;
}

.form-control, .form-select {
    font-size: 0.75rem !important;
    line-height: 1.2 !important;
}

.form-control-sm, .form-select-sm {
    height: 26px !important;
    padding: 2px 6px !important;
    font-size: 0.72rem !important;
    line-height: 1 !important;
}

.btn {
    padding: 3px 8px !important;
    font-size: 0.72rem !important;
    line-height: 1.2 !important;
}

.btn-sm {
    padding: 2px 6px !important;
    font-size: 0.7rem !important;
}

.card {
    margin-bottom: 6px !important;
}

.card-body, .card.p-2, .card.p-3, .card.p-4 {
    padding: 6px 8px !important;
}

.modal-header {
    padding: 6px 12px !important;
}

.modal-title {
    font-size: 0.9rem !important;
}

.modal-body {
    padding: 8px 12px !important;
}

.modal-footer {
    padding: 6px 12px !important;
}

.modal-footer .btn {
    padding: 4px 10px !important;
    font-size: 0.75rem !important;
}

.mb-1, .mb-2, .mb-3, .mb-4 {
    margin-bottom: 4px !important;
}

.mt-1, .mt-2, .mt-3, .mt-4 {
    margin-top: 4px !important;
}

.ms-1, .ms-2, .ms-3 {
    margin-right: 4px !important;
}

.me-1, .me-2, .me-3 {
    margin-left: 4px !important;
}

.p-1, .p-2, .p-3, .p-4 {
    padding: 4px !important;
}

.g-1, .g-2, .g-3 {
    gap: 4px !important;
}

h1, h2, h3, h4, h5, h6 {
    line-height: 1.3 !important;
}

h1 { font-size: 1.2rem !important; margin-bottom: 6px !important; }
h2 { font-size: 1.05rem !important; margin-bottom: 6px !important; }
h3 { font-size: 0.95rem !important; margin-bottom: 4px !important; }
h4 { font-size: 0.9rem !important; margin-bottom: 4px !important; }
h5 { font-size: 0.85rem !important; margin-bottom: 4px !important; }
h6 { font-size: 0.8rem !important; margin-bottom: 4px !important; }

.alert {
    padding: 6px 10px !important;
    margin-bottom: 6px !important;
    font-size: 0.78rem !important;
}

.badge {
    padding: 2px 6px !important;
    font-size: 0.68rem !important;
}

.nav-tabs .nav-link {
    padding: 5px 12px !important;
    font-size: 0.78rem !important;
}

hr {
    margin: 6px 0 !important;
}

/* بطاقات الأعمار (aging) */
.aging-card, .bucket-card, .stat-card {
    padding: 6px 8px !important;
    margin-bottom: 4px !important;
}

.aging-card .h4, .aging-card .h5,
.bucket-card .h4, .bucket-card .h5 {
    font-size: 1rem !important;
    margin: 2px 0 !important;
}

input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button {
    -webkit-appearance: none !important;
    margin: 0 !important;
}
input[type=number] {
    -moz-appearance: textfield !important;
}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>📒</text></svg>">
</head>
<body>
<div class="container-box">
    <div class="d-flex justify-content-between mb-4">
        <h2><i class="bi bi-people-fill"></i> أرصدة العملاء</h2>
        <div>
            <a href="customer_receipts.html" class="btn btn-success"><i class="bi bi-cash-stack"></i> تحصيل جديد</a>
            <button class="btn btn-sm btn-outline-success" onclick="exportToExcel('customer_balances')" title="تصدير Excel">
                <i class="bi bi-file-earmark-excel"></i> Excel
            </button>
            <a href="index.html#customers" class="btn btn-outline-secondary"><i class="bi bi-house"></i> الرئيسية</a>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="stat-card" style="background: linear-gradient(135deg, #4facfe, #00f2fe);">
                <div class="label">إجمالي الفواتير</div>
                <div class="value" id="stat-invoiced">-</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card" style="background: linear-gradient(135deg, #43e97b, #38f9d7);">
                <div class="label">إجمالي المحصّل</div>
                <div class="value" id="stat-paid">-</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card" style="background: linear-gradient(135deg, #fa709a, #fee140);">
                <div class="label">إجمالي المديونيات</div>
                <div class="value" id="stat-balance">-</div>
            </div>
        </div>
    </div>

    <div class="card-box">
        <div class="row g-2 mb-3">
            <div class="col-md-3">
                <select class="form-select" id="flt-only" onchange="load()">
                    <option value="1">العملاء الذين عليهم مديونية فقط</option>
                    <option value="0">كل العملاء</option>
                </select>
            </div>
            <div class="col-md-3">
                <input class="form-control" id="flt-search" placeholder="ابحث بالاسم أو الكود..." oninput="filterTable()">
            </div>
        </div>

        <table class="table table-hover">
            <thead class="table-light">
                <tr>
                    <th>الكود</th>
                    <th>الاسم</th>
                    <th>الهاتف</th>
                    <th class="text-end">إجمالي الفواتير</th>
                    <th class="text-end">إجمالي المحصّل</th>
                    <th class="text-end">الرصيد</th>
                    <th class="text-center">فواتير مفتوحة</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="tbl">
                <tr><td colspan="8" class="text-center">جاري التحميل...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = '/api/v1';
let allRows = [];

async function load() {
    const only = document.getElementById('flt-only').value;
    const r = await fetch(`${API}/customers/balances?only_with_balance=${only}`).then(x => x.json());
    allRows = r.data || [];
    const totals = r.totals || {};
    
    document.getElementById('stat-invoiced').textContent = totals.total_invoiced.toLocaleString('ar-EG', {maximumFractionDigits: 0}) + ' ج.م';
    document.getElementById('stat-paid').textContent = totals.total_paid.toLocaleString('ar-EG', {maximumFractionDigits: 0}) + ' ج.م';
    document.getElementById('stat-balance').textContent = totals.total_balance.toLocaleString('ar-EG', {maximumFractionDigits: 0}) + ' ج.م';
    
    renderTable(allRows);
}

function renderTable(rows) {
    document.getElementById('tbl').innerHTML = rows.length ? rows.map(c => `
        <tr>
            <td><code>${c.code}</code></td>
            <td><strong>${c.name_ar}</strong></td>
            <td>${c.phone || '-'}</td>
            <td class="text-end">${c.total_invoiced.toFixed(2)}</td>
            <td class="text-end text-success">${c.total_paid.toFixed(2)}</td>
            <td class="text-end ${c.balance > 0.01 ? 'balance-positive' : 'balance-zero'}">${c.balance.toFixed(2)}</td>
            <td class="text-center">
                ${c.open_invoices_count > 0 
                    ? `<span class="badge bg-danger">${c.open_invoices_count}</span>` 
                    : '<span class="badge bg-success">0</span>'}
            </td>
            <td>
                <button class="btn btn-sm btn-outline-info" onclick="viewStatement(${c.id})" title="كشف حساب">
                    <i class="bi bi-file-earmark-text"></i> كشف حساب
                </button>
            </td>
        </tr>
    `).join('') : '<tr><td colspan="8" class="text-center text-muted py-4">لا توجد بيانات</td></tr>';
}

function filterTable() {
    const q = document.getElementById('flt-search').value.toLowerCase();
    if (!q) return renderTable(allRows);
    const filtered = allRows.filter(c => 
        c.name_ar.toLowerCase().includes(q) || c.code.toLowerCase().includes(q)
    );
    renderTable(filtered);
}

function viewStatement(id) {
    window.open(`customer_statement.html?id=${id}`, '_blank');
}

load();
</script>

<script>
// دالة تصدير Excel
function exportToExcel(templateKey) {
    if (!templateKey) {
        alert('مفيش قالب تصدير');
        return;
    }
    window.location.href = '/api/v1/export/excel/export/' + templateKey;
}
</script>

</body>
</html>
