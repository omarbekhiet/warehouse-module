<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>📒</text></svg>">

<body>
<div class="container-fluid">
<div class="d-flex justify-content-between mb-4">
<h2><i class="bi bi-clipboard-check"></i> طلبات الاحتياج</h2>
<button class="btn btn-sm btn-outline-success" onclick="exportToExcel('requisitions')" title="تصدير Excel">
                <i class="bi bi-file-earmark-excel"></i> Excel
            </button>
            <a href="index.html#purchases" class="btn btn-outline-secondary"><i class="bi bi-house"></i> الرئيسية</a>
</div>

<div class="alert alert-info">
<i class="bi bi-info-circle"></i> <b>دورة الطلب:</b> قسم يطلب ← اعتماد المدير ← تحويل إلى أمر شراء
</div>

<div class="card-box">
<table class="table table-hover">
<thead class="table-light">
<tr>
<th>رقم الطلب</th><th>التاريخ</th><th>مقدم الطلب</th><th>القسم</th>
<th>الأولوية</th><th>مطلوب بحلول</th><th>الحالة</th>
</tr>
</thead>
<tbody id="tbl">
<tr><td colspan="7" class="text-center text-muted">جاري التحميل...</td></tr>
</tbody>
</table>
</div>
</div>

<script>
const API = '/api/v1';

async function load(){
    try {
        const r = await fetch(`${API}/requisitions/`).then(x => x.json());
        const rows = r.data || [];
        
        const statusLabels = {
            DRAFT: 'مسودة',
            APPROVED: 'معتمد',
            CONVERTED: 'محوّل لأمر شراء',
            REJECTED: 'مرفوض'
        };
        const prioLabels = { LOW: 'منخفضة', NORMAL: 'عادية', HIGH: 'عالية', URGENT: 'عاجلة' };
        
        document.getElementById('tbl').innerHTML = rows.length ? rows.map(m => `
            <tr>
                <td><code>${m.req_no}</code></td>
                <td>${m.req_date}</td>
                <td>${m.requester_name || '-'}</td>
                <td>${m.department || '-'}</td>
                <td>${prioLabels[m.priority] || m.priority}</td>
                <td>${m.needed_by || '-'}</td>
                <td><span class="badge-${m.status}">${statusLabels[m.status] || m.status}</span></td>
            </tr>
        `).join('') : '<tr><td colspan="7" class="text-center text-muted">لا توجد طلبات</td></tr>';
    } catch(e) { console.error(e); }
}

load();
</script>

<script>
// دالة تصدير Excel
function exportToExcel(templateKey) {
    if (!templateKey) {
        alert('مفيش قالب تصدير');
        return;
    }
    window.location.href = '/api/v1/export/excel/export/' + templateKey;
}
</script>

</body>
