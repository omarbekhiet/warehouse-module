<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>طلبات الاحتياج</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; padding: 20px; }
.card-box { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 20px; }
h2 { color: #1e3c72; font-weight: 700; }
table { font-size: 0.9rem; }
.badge-DRAFT { background: #fef3c7; color: #92400e; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; }
.badge-APPROVED { background: #dbeafe; color: #1e40af; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; }
.badge-REJECTED { background: #fee2e2; color: #991b1b; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; }
.badge-CONVERTED { background: #d1fae5; color: #065f46; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; }
</style>
<script src="permissions.js"></script>
</head>
<body>
<div class="container-fluid">
<div class="d-flex justify-content-between mb-4">
<h2><i class="bi bi-clipboard-check"></i> طلبات الاحتياج</h2>
<button class="btn btn-sm btn-outline-success" onclick="exportToExcel('requisitions')" title="تصدير Excel">
                <i class="bi bi-file-earmark-excel"></i> Excel
            </button>
            <a href="index.html" class="btn btn-outline-secondary"><i class="bi bi-house"></i> الرئيسية</a>
</div>

<div class="alert alert-info">
<i class="bi bi-info-circle"></i> <b>دورة الطلب:</b> قسم يطلب ← اعتماد المدير ← تحويل إلى أمر شراء
</div>

<div class="card-box">
<table class="table table-hover">
<thead class="table-light">
<tr>
<th>رقم الطلب</th><th>التاريخ</th><th>مقدم الطلب</th><th>القسم</th>
<th>الأولوية</th><th>مطلوب بحلول</th><th>الحالة</th>
</tr>
</thead>
<tbody id="tbl">
<tr><td colspan="7" class="text-center text-muted">جاري التحميل...</td></tr>
</tbody>
</table>
</div>
</div>

<script>
const API = '/api/v1';

async function load(){
    try {
        const r = await fetch(`${API}/requisitions/`).then(x => x.json());
        const rows = r.data || [];
        
        const statusLabels = {
            DRAFT: 'مسودة',
            APPROVED: 'معتمد',
            CONVERTED: 'محوّل لأمر شراء',
            REJECTED: 'مرفوض'
        };
        const prioLabels = { LOW: 'منخفضة', NORMAL: 'عادية', HIGH: 'عالية', URGENT: 'عاجلة' };
        
        document.getElementById('tbl').innerHTML = rows.length ? rows.map(m => `
            <tr>
                <td><code>${m.req_no}</code></td>
                <td>${m.req_date}</td>
                <td>${m.requester_name || '-'}</td>
                <td>${m.department || '-'}</td>
                <td>${prioLabels[m.priority] || m.priority}</td>
                <td>${m.needed_by || '-'}</td>
                <td><span class="badge-${m.status}">${statusLabels[m.status] || m.status}</span></td>
            </tr>
        `).join('') : '<tr><td colspan="7" class="text-center text-muted">لا توجد طلبات</td></tr>';
    } catch(e) { console.error(e); }
}

load();
</script>

<script>
// دالة تصدير Excel
function exportToExcel(templateKey) {
    if (!templateKey) {
        alert('مفيش قالب تصدير');
        return;
    }
    window.location.href = '/api/v1/export/excel/export/' + templateKey;
}
</script>

</body>
</html>
