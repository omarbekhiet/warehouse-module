<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>صرف النثريات</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Cairo','Segoe UI',Tahoma,sans-serif; background: #f5f6fa; padding: 20px; font-size: 13px; }
.container-box { max-width: 1500px; margin: 0 auto; }
h2 { color: #1e3c72; font-weight: 700; }
.card-box { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }

.stat-card {
    background: white; border-radius: 12px; padding: 15px 20px;
    box-shadow: 0 1px 10px rgba(0,0,0,0.05);
    display: flex; align-items: center; gap: 15px;
    border-right: 4px solid;
}
.stat-card .icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: white; }
.stat-card .label { font-size: 0.78rem; color: #64748b; }
.stat-card .value { font-size: 1.3rem; font-weight: 700; color: #1e3c72; }

.payment-details-box { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 12px; margin-top: 10px; }

/* ============================================
   إلغاء أسهم input[type=number]
   ============================================ */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button {
    -webkit-appearance: none !important;
    margin: 0 !important;
}
input[type=number] {
    -moz-appearance: textfield !important;
    appearance: textfield !important;
}
input[type="number"] {
    -moz-appearance: textfield !important;
}

</style>
<script src="permissions.js"></script>



<style id="compact-spacing-global">

   توحيد المسافات المضغوطة
   ============================================ */

.table td, .table th {
    padding: 3px 6px !important;
    font-size: 0.75rem !important;

    line-height: 1.2 !important;
}

.table tbody tr {
    height: auto !important;
}

    font-size: 0.72rem !important;

    padding: 3px 8px !important;
    font-size: 0.72rem !important;
    line-height: 1.2 !important;
}

.btn-sm {
    padding: 2px 6px !important;

}

.modal-footer .btn {

}

.mb-1, .mb-2, .mb-3, .mb-4 {
    margin-bottom: 4px !important;
}

.mt-1, .mt-2, .mt-3, .mt-4 {
    margin-top: 4px !important;
}

.ms-1, .ms-2, .ms-3 {
    margin-right: 4px !important;
}

.me-1, .me-2, .me-3 {

}

.p-1, .p-2, .p-3, .p-4 {

}

}

h1 { font-size: 1.2rem !important; margin-bottom: 6px !important; }
h2 { font-size: 1.05rem !important; margin-bottom: 6px !important; }
h3 { font-size: 0.95rem !important; margin-bottom: 4px !important; }

.alert {

hr {
    margin: 6px 0 !important;

/* بطاقات الأعمار (aging) */
.aging-card, .bucket-card, .stat-card {
    padding: 6px 8px !important;
    margin-bottom: 4px !important;
}

.aging-card .h4, .aging-card .h5,
.bucket-card .h4, .bucket-card .h5 {
    font-size: 1rem !important;
    margin: 2px 0 !important;
}

input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button {
    -webkit-appearance: none !important;
    margin: 0 !important;
}
input[type=number] {
    -moz-appearance: textfield !important;
}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>📒</text></svg>">
</head>
<body>
<div class="container-box">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-receipt-cutoff text-danger"></i> صرف النثريات</h2>
        <div>
            <button class="btn btn-sm btn-outline-success" onclick="exportToExcel('expenses')" title="تصدير Excel">
                <i class="bi bi-file-earmark-excel"></i> Excel
            </button>
            <a href="expense_categories.html" class="btn btn-outline-warning"><i class="bi bi-tags"></i> التصنيفات</a>
            <a href="cash_boxes.html" class="btn btn-outline-info"><i class="bi bi-safe2-fill"></i> الخزائن</a>
            <a href="index.html#accounting" class="btn btn-outline-secondary"><i class="bi bi-house"></i> الرئيسية</a>
            <button class="btn btn-danger" onclick="openAdd()"><i class="bi bi-plus-circle"></i> مصروف جديد</button>
        </div>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="stat-card" style="border-right-color: #fa709a;">
                <div class="icon" style="background: linear-gradient(135deg, #fa709a, #fee140);"><i class="bi bi-cash-stack"></i></div>
                <div>
                    <div class="label">إجمالي المصروفات</div>
                    <div class="value" id="stat-total">0.00</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card" style="border-right-color: #4facfe;">
                <div class="icon" style="background: linear-gradient(135deg, #4facfe, #00f2fe);"><i class="bi bi-list-check"></i></div>
                <div>
                    <div class="label">عدد العمليات</div>
                    <div class="value" id="stat-count">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card" style="border-right-color: #a18cd1;">
                <div class="icon" style="background: linear-gradient(135deg, #a18cd1, #fbc2eb);"><i class="bi bi-graph-up"></i></div>
                <div>
                    <div class="label">أعلى تصنيف</div>
                    <div class="value" id="stat-top" style="font-size: 1rem;">-</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="card-box">
        <div class="row g-2 mb-3">
            <div class="col-md-3">
                <select class="form-select" id="flt-category" onchange="load()">
                    <option value="">كل التصنيفات</option>
                </select>
            </div>
            <div class="col-md-3">
                <select class="form-select" id="flt-box" onchange="load()">
                    <option value="">كل الخزائن</option>
                </select>
            </div>
            <div class="col-md-2">
                <input type="date" class="form-control" id="flt-from" onchange="load()">
            </div>
            <div class="col-md-2">
                <input type="date" class="form-control" id="flt-to" onchange="load()">
            </div>
            <div class="col-md-2">
                <button class="btn btn-outline-secondary w-100" onclick="resetFilters()"><i class="bi bi-x-circle"></i> مسح</button>
            </div>
        </div>

        <table class="table table-hover">
            <thead class="table-light">
                <tr>
                    <th>رقم المصروف</th>
                    <th>التاريخ</th>
                    <th>التصنيف</th>
                    <th>المستفيد</th>
                    <th>الخزينة</th>
                    <th class="text-end">المبلغ</th>
                    <th>البيان</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="tbl"><tr><td colspan="8" class="text-center text-muted">جاري التحميل...</td></tr></tbody>
        </table>
    </div>

</div>

<!-- Add Modal -->
<div class="modal fade" id="expModal" tabindex="-1">
<div class="modal-dialog modal-lg">
<div class="modal-content">
<div class="modal-header bg-danger text-white">
    <h5 class="modal-title"><i class="bi bi-plus-circle"></i> مصروف جديد</h5>
    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
    <div class="row g-3 mb-3">
        <div class="col-md-4">
            <label class="form-label">التاريخ *</label>
            <input type="date" class="form-control" id="f-date">
        </div>
        <div class="col-md-4">
            <label class="form-label">التصنيف *</label>
            <select class="form-select" id="f-category"></select>
        </div>
        <div class="col-md-4">
            <label class="form-label">الخزينة *</label>
            <select class="form-select" id="f-box" onchange="showBalance()"></select>
            <small class="text-muted">الرصيد: <strong id="f-balance">-</strong></small>
        </div>
    </div>
    <div class="row g-3 mb-3">
        <div class="col-md-4">
            <label class="form-label">المبلغ *</label>
            <input type="number" class="form-control" id="f-amount" step="0.01" min="0.01">
        </div>
        <div class="col-md-4">
            <label class="form-label">المستفيد</label>
            <input class="form-control" id="f-beneficiary">
        </div>
        <div class="col-md-4">
            <label class="form-label">المرجع</label>
            <input class="form-control" id="f-reference">
        </div>
    </div>
    <div class="row g-3 mb-3">
        <div class="col-12">
            <label class="form-label">البيان *</label>
            <input class="form-control" id="f-description">
        </div>
    </div>

    <!-- Payment Details -->
    <div class="payment-details-box">
        <h6 class="text-primary mb-3"><i class="bi bi-info-circle"></i> تفاصيل طريقة الدفع</h6>
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label">طريقة الدفع</label>
                <select class="form-select" id="f-payment-type" onchange="onPaymentTypeChange()">
                    <option value="CASH">نقدي</option>
                    <option value="CHEQUE">شيك</option>
                    <option value="TRANSFER">تحويل بنكي</option>
                    <option value="CARD">بطاقة</option>
                </select>
            </div>
        </div>
        
        <div class="row g-3 mt-2" id="cheque-fields" style="display:none;">
            <div class="col-md-4"><label class="form-label">رقم الشيك</label><input class="form-control" id="f-cheque-no"></div>
            <div class="col-md-4"><label class="form-label">البنك</label><input class="form-control" id="f-cheque-bank"></div>
            <div class="col-md-4"><label class="form-label">تاريخ الاستحقاق</label><input type="date" class="form-control" id="f-cheque-date"></div>
        </div>
        
        <div class="row g-3 mt-2" id="transfer-fields" style="display:none;">
            <div class="col-md-6"><label class="form-label">رقم الحوالة</label><input class="form-control" id="f-transfer-no"></div>
            <div class="col-md-6"><label class="form-label">البنك</label><input class="form-control" id="f-transfer-bank"></div>
        </div>
        
        <div class="row g-3 mt-2" id="card-fields" style="display:none;">
            <div class="col-md-4"><label class="form-label">رقم العملية</label><input class="form-control" id="f-card-txn"></div>
            <div class="col-md-4"><label class="form-label">آخر 4 أرقام</label><input class="form-control" id="f-card-last4" maxlength="4"></div>
            <div class="col-md-4"><label class="form-label">البنك</label><input class="form-control" id="f-card-bank"></div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
    <button class="btn btn-danger" onclick="save()"><i class="bi bi-check-circle"></i> حفظ</button>
</div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = '/api/v1';
const expModal = new bootstrap.Modal(document.getElementById('expModal'));

let allExpenses = [];
let categoriesList = [];
let boxesList = [];

async function loadRefs() {
    const [c, b] = await Promise.all([
        fetch(`${API}/expenses/categories/`).then(r => r.json()),
        fetch(`${API}/cash-boxes/boxes/`).then(r => r.json())
    ]);
    
    categoriesList = c.data || [];
    boxesList = b.data || [];
    
    document.getElementById('f-category').innerHTML = '<option value="">— اختر تصنيف —</option>' +
        categoriesList.map(c => `<option value="${c.id}">${c.code} - ${c.name_ar}</option>`).join('');
    
    document.getElementById('f-box').innerHTML = '<option value="">— اختر خزينة —</option>' +
        boxesList.map(b => `<option value="${b.id}" data-balance="${b.current_balance}">${b.code} - ${b.name_ar}</option>`).join('');
    
    document.getElementById('flt-category').innerHTML = '<option value="">كل التصنيفات</option>' +
        categoriesList.map(c => `<option value="${c.id}">${c.name_ar}</option>`).join('');
    
    document.getElementById('flt-box').innerHTML = '<option value="">كل الخزائن</option>' +
        boxesList.map(b => `<option value="${b.id}">${b.name_ar}</option>`).join('');
}

async function load() {
    const cat = document.getElementById('flt-category').value;
    const box = document.getElementById('flt-box').value;
    const from = document.getElementById('flt-from').value;
    const to = document.getElementById('flt-to').value;
    
    let url = `${API}/expenses/expenses/?limit=500`;
    if (cat) url += `&category_id=${cat}`;
    if (box) url += `&cash_box_id=${box}`;
    if (from) url += `&date_from=${from}`;
    if (to) url += `&date_to=${to}`;
    
    const r = await fetch(url).then(x => x.json());
    allExpenses = r.data || [];
    renderTable();
    
    // Stats
    const statsUrl = `${API}/expenses/stats?` +
        (from ? `date_from=${from}&` : '') + 
        (to ? `date_to=${to}` : '');
    const s = await fetch(statsUrl).then(x => x.json());
    if (s.success) {
        document.getElementById('stat-total').textContent = s.data.total_amount.toFixed(2) + ' ج.م';
        document.getElementById('stat-count').textContent = s.data.total_count;
        if (s.data.by_category && s.data.by_category.length) {
            const top = s.data.by_category.reduce((a, b) => (a.total > b.total ? a : b));
            document.getElementById('stat-top').textContent = top.name_ar + ' (' + parseFloat(top.total).toFixed(0) + ')';
        }
    }
}

function renderTable() {
    document.getElementById('tbl').innerHTML = allExpenses.length ? allExpenses.map(e => `
        <tr>
            <td><code>${e.expense_no}</code></td>
            <td>${e.expense_date}</td>
            <td><strong>${e.category_name || '-'}</strong></td>
            <td>${e.beneficiary || '-'}</td>
            <td>${e.box_name || '-'}</td>
            <td class="text-end text-danger"><strong>${parseFloat(e.amount).toFixed(2)}</strong></td>
            <td><small>${e.description || '-'}</small></td>
            <td>
                <button class="btn btn-sm btn-outline-info" onclick="viewExpense(${e.id})"><i class="bi bi-eye"></i></button>
                <button class="btn btn-sm btn-outline-danger" onclick="del(${e.id})"><i class="bi bi-trash"></i></button>
            </td>
        </tr>
    `).join('') : '<tr><td colspan="8" class="text-center text-muted py-4">لا توجد مصروفات</td></tr>';
}

function resetFilters() {
    ['flt-category', 'flt-box', 'flt-from', 'flt-to'].forEach(id => document.getElementById(id).value = '');
    load();
}

function openAdd() {
    if (!categoriesList.length) { alert('أضف تصنيفاً أولاً'); return; }
    if (!boxesList.length) { alert('أضف خزينة أولاً'); return; }
    
    document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
    document.getElementById('f-category').value = '';
    document.getElementById('f-box').value = '';
    document.getElementById('f-amount').value = '';
    document.getElementById('f-beneficiary').value = '';
    document.getElementById('f-reference').value = '';
    document.getElementById('f-description').value = '';
    document.getElementById('f-payment-type').value = 'CASH';
    document.getElementById('f-balance').textContent = '-';
    onPaymentTypeChange();
    expModal.show();
}

function showBalance() {
    const sel = document.getElementById('f-box');
    const opt = sel.options[sel.selectedIndex];
    const bal = opt.getAttribute('data-balance');
    document.getElementById('f-balance').textContent = bal ? parseFloat(bal).toFixed(2) : '-';
}

function onPaymentTypeChange() {
    const type = document.getElementById('f-payment-type').value;
    ['cheque-fields', 'transfer-fields', 'card-fields'].forEach(id => 
        document.getElementById(id).style.display = 'none');
    
    if (type === 'CHEQUE') document.getElementById('cheque-fields').style.display = 'flex';
    else if (type === 'TRANSFER') document.getElementById('transfer-fields').style.display = 'flex';
    else if (type === 'CARD') document.getElementById('card-fields').style.display = 'flex';
}

async function save() {
    const data = {
        expense_date: document.getElementById('f-date').value,
        category_id: parseInt(document.getElementById('f-category').value),
        cash_box_id: parseInt(document.getElementById('f-box').value),
        amount: parseFloat(document.getElementById('f-amount').value),
        beneficiary: document.getElementById('f-beneficiary').value.trim(),
        reference: document.getElementById('f-reference').value.trim(),
        description: document.getElementById('f-description').value.trim(),
        details: {
            payment_type: document.getElementById('f-payment-type').value,
            cheque_no: document.getElementById('f-cheque-no').value,
            cheque_bank: document.getElementById('f-cheque-bank').value,
            cheque_date: document.getElementById('f-cheque-date').value,
            transfer_no: document.getElementById('f-transfer-no').value,
            transfer_bank: document.getElementById('f-transfer-bank').value,
            card_txn_no: document.getElementById('f-card-txn').value,
            card_last4: document.getElementById('f-card-last4').value,
            card_bank: document.getElementById('f-card-bank').value
        }
    };
    
    if (!data.category_id) { alert('اختر التصنيف'); return; }
    if (!data.cash_box_id) { alert('اختر الخزينة'); return; }
    if (!data.amount || data.amount <= 0) { alert('أدخل مبلغاً صحيحاً'); return; }
    if (!data.description) { alert('أدخل البيان'); return; }
    
    const r = await fetch(`${API}/expenses/expenses/`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    }).then(x => x.json());
    
    if (r.success) {
        alert(`✅ تم حفظ المصروف: ${r.data.expense_no}`);
        expModal.hide();
        await loadRefs();
        load();
    } else {
        alert('❌ ' + (r.message || 'خطأ'));
    }
}

async function viewExpense(id) {
    const r = await fetch(`${API}/expenses/expenses/${id}`).then(x => x.json());
    if (!r.success) return;
    const e = r.data;
    
    let html = `
        <p><strong>رقم المصروف:</strong> <code>${e.expense_no}</code></p>
        <p><strong>التاريخ:</strong> ${e.expense_date}</p>
        <p><strong>التصنيف:</strong> ${e.category_name} (${e.category_account})</p>
        <p><strong>المبلغ:</strong> <strong class="text-danger">${parseFloat(e.amount).toFixed(2)}</strong></p>
        <p><strong>المستفيد:</strong> ${e.beneficiary || '-'}</p>
        <p><strong>الخزينة:</strong> ${e.box_name} (${e.box_account})</p>
        <p><strong>البيان:</strong> ${e.description || '-'}</p>
    `;
    alert(html.replace(/<[^>]+>/g, ''));
}

async function del(id) {
    if (!confirm('حذف المصروف؟ سيُحذف القيد المحاسبي ويُسترد رصيد الخزينة.')) return;
    const r = await fetch(`${API}/expenses/expenses/${id}`, {method: 'DELETE'}).then(x => x.json());
    if (r.success) { alert('تم الحذف'); load(); }
    else alert(r.message || 'خطأ');
}

(async () => {
    await loadRefs();
    await load();
})();
</script>

<script>
// دالة تصدير Excel
function exportToExcel(templateKey) {
    if (!templateKey) {
        alert('مفيش قالب تصدير');
        return;
    }
    window.location.href = '/api/v1/export/excel/export/' + templateKey;
}
</script>

</body>
