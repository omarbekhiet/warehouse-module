<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>تسجيل الدخول</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
body {
    background: linear-gradient(135deg, #2c3e50 0%, #1abc9c 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, sans-serif;
}
.login-card {
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 40px;
    max-width: 450px;
    width: 100%;
}
.login-card .logo {
    font-size: 4rem;
    color: #1abc9c;
    text-align: center;
    margin-bottom: 10px;
}
.login-card h2 {
    text-align: center;
    color: #2c3e50;
    margin-bottom: 30px;
}
.form-control { border-radius: 10px; padding: 12px; }
.btn-login {
    background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%);
    border: none;
    border-radius: 10px;
    padding: 12px;
    color: white;
    font-weight: 600;
    width: 100%;
    margin-top: 10px;
}
.btn-login:hover { color: white; opacity: 0.9; }
.hint { font-size: 0.85rem; color: #7f8c8d; text-align: center; margin-top: 20px; }

/* ============================================
   إلغاء أسهم input[type=number]
   ============================================ */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button {
    -webkit-appearance: none !important;
    margin: 0 !important;
}
input[type=number] {
    -moz-appearance: textfield !important;
    appearance: textfield !important;
}
input[type="number"] {
    -moz-appearance: textfield !important;
}

</style>

<style id="compact-spacing-global">
/* ============================================
   توحيد المسافات المضغوطة — كل المشروع
   ============================================ */

/* الجداول */
.table td,
.table th {
    padding: 3px 6px !important;
    font-size: 0.75rem !important;
    vertical-align: middle !important;
    line-height: 1.2 !important;
}

.table tbody tr {
    height: auto !important;
}

/* الـ inputs */
.form-control,
.form-select {
    font-size: 0.75rem !important;
    line-height: 1.2 !important;
}

.form-control-sm,
.form-select-sm {
    height: 26px !important;
    padding: 2px 6px !important;
    font-size: 0.72rem !important;
    line-height: 1 !important;
}

/* الأزرار */
.btn {
    padding: 3px 8px !important;
    font-size: 0.72rem !important;
    line-height: 1.2 !important;
}

.btn-sm {
    padding: 2px 6px !important;
    font-size: 0.7rem !important;
}

/* البطاقات */
.card {
    margin-bottom: 6px !important;
}

.card-body,
.card.p-2,
.card.p-3,
.card.p-4 {
    padding: 6px 8px !important;
}

/* الـ Modal */
.modal-header {
    padding: 6px 12px !important;
}

.modal-title {
    font-size: 0.9rem !important;
}

.modal-body {
    padding: 8px 12px !important;
}

.modal-footer {
    padding: 6px 12px !important;
}

.modal-footer .btn {
    padding: 4px 10px !important;
    font-size: 0.75rem !important;
}

/* المسافات */
.mb-1, .mb-2, .mb-3, .mb-4 {
    margin-bottom: 4px !important;
}

.mt-1, .mt-2, .mt-3, .mt-4 {
    margin-top: 4px !important;
}

.ms-1, .ms-2, .ms-3 {
    margin-right: 4px !important;
}

.me-1, .me-2, .me-3 {
    margin-left: 4px !important;
}

.p-1, .p-2, .p-3, .p-4 {
    padding: 4px !important;
}

.g-1, .g-2, .g-3 {
    gap: 4px !important;
}

/* العناوين */
h1, h2, h3, h4, h5, h6 {
    line-height: 1.3 !important;
}

h1 { font-size: 1.2rem !important; margin-bottom: 6px !important; }
h2 { font-size: 1.05rem !important; margin-bottom: 6px !important; }
h3 { font-size: 0.95rem !important; margin-bottom: 4px !important; }
h4 { font-size: 0.9rem !important; margin-bottom: 4px !important; }
h5 { font-size: 0.85rem !important; margin-bottom: 4px !important; }
h6 { font-size: 0.8rem !important; margin-bottom: 4px !important; }

/* الـ alerts */
.alert {
    padding: 6px 10px !important;
    margin-bottom: 6px !important;
    font-size: 0.78rem !important;
}

/* الـ badges */
.badge {
    padding: 2px 6px !important;
    font-size: 0.68rem !important;
}

/* الـ tabs */
.nav-tabs .nav-link {
    padding: 5px 12px !important;
    font-size: 0.78rem !important;
}

/* الـ dropdown */
.dropdown-menu {
    font-size: 0.78rem !important;
    padding: 4px !important;
}

.dropdown-item {
    padding: 4px 8px !important;
    font-size: 0.75rem !important;
}

/* الـ hr */
hr {
    margin: 6px 0 !important;
}

/* الـ Modal dialog */
.modal-dialog {
    margin: 6px auto !important;
}

/* ============================================
   إخفاء أسهم input[type=number]
   ============================================ */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button {
    -webkit-appearance: none !important;
    margin: 0 !important;
}
input[type=number] {
    -moz-appearance: textfield !important;
}
</style>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>📒</text></svg>">
</head>
<body>
<div class="login-card">
<div class="logo"><i class="bi bi-box-seam"></i></div>
<h2>موديول المخازن</h2>

<form onsubmit="login(event)">
<div class="mb-3">
<label class="form-label"><i class="bi bi-person"></i> اسم المستخدم</label>
<input type="text" class="form-control" id="username" value="admin" autocomplete="username">
</div>
<div class="mb-3">
<label class="form-label"><i class="bi bi-lock"></i> كلمة المرور</label>
<input type="password" class="form-control" id="password" value="admin123" autocomplete="current-password">
</div>
<button type="submit" class="btn btn-login">
<i class="bi bi-box-arrow-in-right"></i> دخول
</button>
</form>

<div id="error" class="alert alert-danger mt-3" style="display:none;"></div>

<div class="hint">
<i class="bi bi-info-circle"></i> افتراضي: admin / admin123
</div>
</div>

<script>
async function login(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const err = document.getElementById('error');
    err.style.display = 'none';

    try {
        const r = await fetch('http://localhost:5000/api/v1/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        }).then(x => x.json());

        if (r.success) {
            var user = r.data.user;

            // حفظ بيانات المستخدم
            localStorage.setItem('user', JSON.stringify(user));
            localStorage.setItem('token', r.data.token);

            // ✅ حفظ user_id
            localStorage.setItem('user_id', user.id);

            // ✅ حفظ الدور والاسم
            localStorage.setItem('user_role', user.role || 'VIEWER');
            localStorage.setItem('user_name', user.full_name || user.username || 'مستخدم');

            // ✅ حفظ الصلاحيات (الفردية → وإلا صلاحيات الدور)
            if (user.permissions && Array.isArray(user.permissions) && user.permissions.length > 0) {
                localStorage.setItem('user_permissions', JSON.stringify(user.permissions));
                console.log('✅ حفظ صلاحيات فردية:', user.permissions.length);
            } else if (user.role_permissions && Array.isArray(user.role_permissions) && user.role_permissions.length > 0) {
                localStorage.setItem('user_permissions', JSON.stringify(user.role_permissions));
                console.log('✅ حفظ صلاحيات الدور:', user.role_permissions.length);
            } else {
                localStorage.removeItem('user_permissions');
                console.log('⚠️ مفيش صلاحيات — هيستخدم الأدوار الافتراضية');
            }

            // ✅ حفظ الفروع
            if (user.branch_ids && Array.isArray(user.branch_ids)) {
                localStorage.setItem('user_branches', JSON.stringify(user.branch_ids));
            } else {
                localStorage.removeItem('user_branches');
            }

            window.location.href = 'index.html';
        } else {
            err.textContent = r.message || 'خطأ في تسجيل الدخول';
            err.style.display = 'block';
        }
    } catch (e) {
        console.error(e);
        err.textContent = 'خطأ في الاتصال بالخادم';
        err.style.display = 'block';
    }
}
</script>
